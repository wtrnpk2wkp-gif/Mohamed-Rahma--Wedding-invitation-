<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed & Rahma Wedding Invitation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-cream: #FAF7F2;
            --card-bg: #FFFFFF;
            --burgundy: #6B1D2F;
            --burgundy-dark: #4A121F;
            --burgundy-light: #8C2B42;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --text-dark: #2C2C2C;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* Container & Envelope Styles */
        .wrapper {
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .envelope-container {
            width: 100%;
            height: 320px;
            position: relative;
            cursor: pointer;
            transition: transform 0.6s ease;
        }

        .envelope {
            width: 100%;
            height: 100%;
            background-color: var(--burgundy-dark);
            border-radius: 8px;
            position: absolute;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 225px solid transparent;
            border-right: 225px solid transparent;
            border-top: 160px solid var(--burgundy);
            transform-origin: top;
            transition: transform 0.8s ease 0.2s, z-index 0.2s ease 0.4s;
            z-index: 5;
        }

        @media (max-width: 450px) {
            .envelope-flap {
                border-left-width: calc(50vw - 10px);
                border-right-width: calc(50vw - 10px);
            }
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 225px solid var(--burgundy-light);
            border-right: 225px solid var(--burgundy-light);
            border-bottom: 160px solid var(--burgundy);
            z-index: 4;
        }

        @media (max-width: 450px) {
            .envelope-pocket {
                border-left-width: calc(50vw - 10px);
                border-right-width: calc(50vw - 10px);
            }
        }

        .seal {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, var(--gold-light), var(--gold));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--burgundy-dark);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 6;
            transition: opacity 0.4s ease;
            border: 2px solid var(--gold);
        }

        .tap-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: var(--gold-light);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 7;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Card Content Styles */
        .card {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            background-image: radial-gradient(var(--gold-light) 0.5px, transparent 0.5px);
            background-size: 15px 15px;
        }

        .card-border {
            border: 1px solid var(--burgundy);
            padding: 30px 15px;
            border-radius: 8px;
            position: relative;
        }

        .card-border::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 1px solid var(--gold);
            border-radius: 5px;
            pointer-events: none;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--burgundy);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: var(--burgundy-dark);
            margin: 15px 0;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .ampersand {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: var(--gold);
            display: block;
            margin: 5px 0;
        }

        .invitation-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 20px 0;
            line-height: 1.6;
            font-weight: 300;
        }

        .details-divider {
            width: 60px;
            height: 1px;
            background: var(--gold);
            margin: 20px auto;
        }

        .date-time {
            font-family: 'Cinzel', serif;
            color: var(--burgundy);
            margin: 20px 0;
        }

        .date {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .time {
            font-size: 1rem;
            margin-top: 5px;
            color: var(--text-dark);
        }

        /* Countdown Timer */
        .timer-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
        }

        .time-box {
            background: var(--bg-cream);
            border: 1px solid var(--gold-light);
            padding: 8px;
            border-radius: 6px;
            min-width: 60px;
        }

        .time-box span {
            display: block;
        }

        .number {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--burgundy);
        }

        .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Location Button */
        .location-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--burgundy), var(--burgundy-dark));
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(107, 29, 47, 0.3);
            transition: all 0.3s ease;
            border: 1px solid var(--gold);
        }

        .location-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(107, 29, 47, 0.4);
        }

        /* Open state classes */
        .wrapper.open .envelope-container {
            display: none;
        }

        .wrapper.open .card {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="wrapper" id="wrapper">
        <!-- Envelope Animation Section -->
        <div class="envelope-container" onclick="openEnvelope()">
            <div class="envelope">
                <div class="envelope-flap" id="flap"></div>
                <div class="seal" id="seal">M&R</div>
                <div class="envelope-pocket"></div>
                <div class="tap-hint">Tap to Open Invitation</div>
            </div>
        </div>

        <!-- Digital Invitation Card -->
        <div class="card" id="card">
            <div class="card-border">
                <div class="subtitle">Together With Their Families</div>
                
                <div class="names">
                    Mohamed
                    <span class="ampersand">&</span>
                    Rahma
                </div>

                <div class="invitation-text">
                    Invite you to celebrate their wedding ceremony and share the joy of their special day.
                </div>

                <div class="details-divider"></div>

                <div class="date-time">
                    <div class="date">SATURDAY, NOVEMBER 7, 2026</div>
                    <div class="time">AT 8:00 PM</div>
                </div>

                <!-- Countdown Timer -->
                <div class="timer-container">
                    <div class="time-box">
                        <span class="number" id="days">00</span>
                        <span class="label">Days</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="hours">00</span>
                        <span class="label">Hours</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="minutes">00</span>
                        <span class="label">Mins</span>
                    </div>
                    <div class="time-box">
                        <span class="number" id="seconds">00</span>
                        <span class="label">Secs</span>
                    </div>
                </div>

                <!-- Venue Location -->
                <a href="https://maps.app.goo.gl/ixVMxZWbL2ZdxAda6?g_st=ic" target="_blank" class="location-btn">
                    <i class="fa-solid fa-location-dot"></i> View Location
                </a>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const wrapper = document.getElementById('wrapper');
            wrapper.classList.add('open');
        }

        // Countdown Timer Logic
        const weddingDate = new Date("November 7, 2026 20:00:00").getTime();

        const countdown = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(countdown);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
            }
        }, 1000);
    </script>
</body>
</html>
